[package]
name = "corvid_transform"
description = "Deterministic fixed-point rigid transforms, sized for an earth-scale VR game."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["fixed-point", "deterministic", "transform", "no-std", "gamedev"]
categories = ["game-development", "mathematics", "no-std::no-alloc"]

[dependencies]
corvid_bits = { workspace = true }
arbitrary = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
corvid_fixed = { version = "0.1.0", path = "../corvid_fixed" }
corvid_rotation = { version = "0.1.0", path = "../corvid_rotation" }
corvid_vector = { version = "0.1.0", path = "../corvid_vector" }
serde = { workspace = true, optional = true }

[dev-dependencies]
# The workspace's one encoding, so this crate's byte goldens are recorded in the
# format a capture is written in. A position is most of what a snapshot holds,
# and a component's width is the one change nothing else here can see.
corvid_wire = { workspace = true }
# The digest the tests here check a transform's encoding against. Nothing in the
# source names it: a transform's `Hash` is derived, and what the tests pin is
# what that emission comes to under this workspace's one hasher.
corvid_hash = { workspace = true }
# A self-describing format, for the half `corvid_wire` cannot show. A varint
# writes no names and no order it did not already have, so `tests/interop.rs`
# spells a transform out as `{"position":…,"rotation":…}` — which is where a
# field renamed, or the two exchanged, stops being invisible.
serde_json = { workspace = true }

[features]
default = []
# This crate has no interop code of its own; it re-exports the types and
# forwards the features, so `mint` and `nalgebra` are not direct dependencies.
mint = ["corvid_rotation/mint"]
nalgebra = ["corvid_rotation/nalgebra"]
serde = ["dep:serde", "corvid_rotation/serde", "corvid_vector/serde", "corvid_fixed/serde"]
bytemuck = ["dep:bytemuck", "corvid_rotation/bytemuck", "corvid_vector/bytemuck", "corvid_fixed/bytemuck"]
arbitrary = ["dep:arbitrary", "corvid_rotation/arbitrary", "corvid_vector/arbitrary", "corvid_fixed/arbitrary"]
std = [
    "bytemuck?/extern_crate_std",
    "serde?/std",
    "corvid_rotation/std",
    "corvid_vector/std",
    "corvid_fixed/std",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
