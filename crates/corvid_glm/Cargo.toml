[package]
name = "corvid_glm"
description = "The workspace's f32 vectors and matrices: nalgebra, in the column-major order a shader reads, with the aliases a game spells them by."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["nalgebra", "matrix", "vector", "no-std", "gamedev"]
categories = ["game-development", "mathematics", "no-std"]

[dependencies]
# The one linear algebra library in this workspace, and this is the one crate
# that names it for its `f32` types. `libm` because a `no_std` build still needs
# a square root to normalize a vector, and nalgebra gates that on one of its own
# float backends.
nalgebra = { workspace = true, features = ["libm"] }
# `Pod` and `Zeroable` on the matrices, which is what lets a camera be written
# into a uniform buffer without an `unsafe` block. The impls are nalgebra's own,
# switched on by its `convert-bytemuck` feature below; this crate writes none of
# its own and could not, because `unsafe_code` is forbidden workspace-wide. The
# dependency is still named here rather than left to nalgebra so that the
# workspace pin is what nalgebra's optional copy unifies against — one bytemuck
# in the graph — and so `std` has somewhere to forward `extern_crate_std`.
bytemuck = { workspace = true, optional = true }
# Interoperation, for the same reason `corvid_vector` offers it: a game with a
# glTF loader or a physics engine of its own speaks one of these.
mint = { workspace = true, optional = true }

[features]
default = []
bytemuck = ["dep:bytemuck", "nalgebra/convert-bytemuck"]
mint = ["dep:mint", "nalgebra/mint"]
# The crate itself stays `no_std` under every feature — it is type aliases and
# one `const`, and none of that needs an allocator, so there is no `cfg` on the
# inner attribute to make conditional. `std` is purely a forwarding switch for
# the graph underneath: a downstream that is already linking std uses it to say
# so to nalgebra and bytemuck, rather than leaving them in the no_std
# configuration the default build picks.
std = ["nalgebra/std", "bytemuck?/extern_crate_std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
