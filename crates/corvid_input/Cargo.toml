[package]
name = "corvid_input"
description = "One frame of input as data: action sets, dense identifiers, and the snapshot a client turns into an action."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["input", "action-sets", "gamepad", "no-std", "gamedev"]
categories = ["game-development", "no-std"]

[dependencies]
corvid_fixed = { workspace = true }
corvid_vector = { workspace = true }
corvid_bits = { workspace = true }
# For `FineTransform`, which a tracked pose is, and for `Signed16`, which both
# axes of an analog action are. Nothing else here needs the maths stack.
corvid_transform = { version = "0.1.0", path = "../corvid_transform", default-features = false }
serde = { workspace = true, optional = true }

[features]
default = []
# The identifiers and the two value types, written down. A saved binding file
# and a recorded input log are the two things that carry them, and both are
# somebody else's format — this feature supplies the parts, not the file.
serde = ["dep:serde", "serde?/alloc", "corvid_transform/serde"]
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate.
std = ["corvid_transform/std", "serde?/std"]
# The half that faces devices: the control vocabulary, the binding table, and
# the accumulator that works out the edges. It adds no dependency and forwards
# no `std`, because none of it needs one. `src/platform/mod.rs` lists what is
# here and what is not.
platform = []

[lints]
workspace = true

# Every optional integration is off by default, so a plain build documents none
# of them.
[package.metadata.docs.rs]
all-features = true
