[package]
name = "corvid_text"
description = "Glyphs, laid out, with no device in sight: a parsed face, a coverage bitmap, an atlas, a kerned run in fixed point, and the line breaks under it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["gamedev", "text", "font", "no-std", "fixed-point"]
categories = ["game-development", "text-processing", "no-std"]

[dependencies]
# `I16F16`, which every position a layout reads is measured in.
corvid_fixed = { workspace = true }
# `demote`, `floor`, `ceil` and `sqrt` on `f32` without an operating system.
# Coverage is the one half of this crate that is float, and `core` has no
# `sqrt` on a target with no libm.
corvid_float = { workspace = true }
# `GlyphId` and `Metrics`, which this crate implements rather than restates: a
# `Font` here is a font a `corvid_ui` layout can already measure with, and a
# second glyph number would be a second vocabulary for the same idea.
corvid_ui = { workspace = true }
# The `Display` and `Error` impls on `FontError` and `AtlasFull`, derived.
thiserror = { workspace = true }
# The font parser, and written here rather than in the workspace manifest
# because no other member names it. It is the crate that does exactly one thing:
# it reads the tables of a TrueType, OpenType or AAT face and answers what they
# say, with no rasteriser, no shaper, no layout engine and no allocator inside
# it. `default-features = false` drops its `std`, its variable-font support and
# its glyph-name table; `opentype-layout` is what makes the GPOS `kern` feature
# readable, which is where a modern face keeps its kerning.
# `no-std-float` is how it reaches a sine without an operating system: the one
# feature here that would rather not be on, and the price of the `no_std` this
# workspace is built for.
ttf-parser = { version = "0.25", default-features = false, features = [
    "no-std-float",
    "opentype-layout",
] }

[features]
default = []
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate -- which is the whole point: a
# face parses and a glyph rasterises on a target with no operating system.
std = ["corvid_fixed/std", "corvid_ui/std", "ttf-parser/std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
