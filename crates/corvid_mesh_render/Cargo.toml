[package]
name = "corvid_mesh_render"
description = "The device half of a mesh: the vertex layout a pipeline names, the upload, and the draw call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["gamedev", "wgpu", "mesh", "renderer"]
categories = ["game-development", "graphics"]

[dependencies]
# The device. Pinned at the workspace level, which is what keeps one `wgpu` and
# one `raw-window-handle` in the graph now that it is named here rather than
# reached through `corvid_render`.
wgpu = { workspace = true }
# The geometry. This crate adds a device to it and nothing else.
corvid_mesh = { workspace = true }
# The renderer this one draws through: a `Target`, and the device behind it.
# Not a route to `wgpu` — that is named directly above, and the workspace pin is
# what keeps one of it in the graph.
corvid_render = { workspace = true }
# Vertex and index buffers are bytes to `wgpu`, and this is the workspace's one
# safe way to turn a struct into them. Without it the casts would need
# `unsafe`, which is forbidden here.
bytemuck = { workspace = true }

[dev-dependencies]
# The scale a mesh carries, which the README's example names.
corvid_fixed = { workspace = true, features = ["std"] }
# The decoder half. `corvid_render` encodes a read-back frame and never reads
# one back in, so the round trip is only assertable from a test. `wgpu` and
# `bytemuck` are not here: `tests/offscreen.rs` brings its own pipeline and its
# own shader, the way a game does, and names both directly — but both are already
# dependencies above, and a dependency is already linkable from a test.
png = { workspace = true }
# What `tests/offscreen.rs` builds a scene out of: a camera to look with, a
# rotation and a transform to place the cube by, and the vector and shape types
# they are spelled in. Every one of them is already under `corvid_render`, so
# the test binary is the only thing that gains an edge.
corvid_camera = { workspace = true, features = ["std"] }
corvid_glm = { workspace = true }
corvid_rotation = { workspace = true, features = ["std"] }
corvid_shape = { workspace = true, features = ["std"] }
corvid_transform = { workspace = true, features = ["std"] }
corvid_vector = { workspace = true, features = ["bytemuck", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
