[package]
name = "corvid_bits"
description = "Bit manipulation for deterministic integer maths: how wide a magnitude is, and bringing a wide intermediate back to a component."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["bits", "deterministic", "no-std", "gamedev", "integer"]
categories = ["game-development", "mathematics", "no-std::no-alloc"]

# None, and there is nothing here that could want one. Every function in this
# crate is a shift, a comparison and a cast on a primitive integer, which is the
# floor the rest of the workspace's arithmetic is built on.
[dependencies]

[features]
default = []
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate.
std = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
