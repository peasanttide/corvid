[package]
name = "corvid_sound"
description = "What to hear, as data: a fixed-point audio frame with no device and no mixer behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["audio", "deterministic", "rollback", "no-std", "gamedev"]
categories = ["game-development", "no-std"]

[dependencies]
# `Auralizer` is one of the four contracts an `App` is made of, so it names a
# `State`, an `Extract` and a `Time`; and a `Camera`, because the ears go where
# the eye is.
corvid_behavior = { workspace = true, features = ["std"] }
corvid_camera = { workspace = true, features = ["std"] }
corvid_fixed = { workspace = true }
corvid_vector = { workspace = true }
corvid_hash = { workspace = true }
# `Tick` alone, and not the crate whole — see the `std` feature below.
corvid_time = { version = "0.1.0", path = "../corvid_time", default-features = false }
corvid_transform = { version = "0.1.0", path = "../corvid_transform", default-features = false }
serde = { workspace = true, optional = true, features = ["alloc"] }

[features]
default = []
# Forwarded to the crates the frame is built out of, so a downstream that turns
# it on here gets it on the positions and the gains too rather than discovering
# halfway through a capture that the one thing it cannot serialize is a
# `FinePoint`.
serde = ["dep:serde", "corvid_time/serde", "corvid_transform/serde"]
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate.
#
# `corvid_time/std` is deliberately not on that list, for the reason
# `corvid_behavior` gives: it is the one dependency whose `std` feature adds a
# type, and the type is `Wall`, a clock. Cargo unifies features across a build,
# so forwarding it here would hand a wall clock to everything that draws an
# audio frame as a side effect of something else turning `std` on. Nothing in
# this crate asks what time it is; it is told which `Tick` a cue fired on.
std = ["corvid_hash/std", "corvid_transform/std", "serde?/std"]

[lints]
workspace = true

# Every optional integration is off by default, so a plain build documents none
# of the serde impls.
[package.metadata.docs.rs]
all-features = true
