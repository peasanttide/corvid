[package]
name = "corvid_dev"
description = "A console whose help is generated from types, tunables that can only propose, a time slider and the digest overlay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["gamedev", "console", "tooling", "replay", "deterministic"]
categories = ["game-development", "development-tools"]

[dependencies]
corvid_fixed = { workspace = true, features = ["std"] }
# The `Simulate` a tunable's `Rules`, an inspector's `State` and a frame dump's
# two states all belong to.
corvid_behavior = { version = "0.1", path = "../corvid_behavior", features = ["std"] }
# The digest on the overlay, and the one a frame dump prints per state.
corvid_hash = { version = "0.1", path = "../corvid_hash", features = ["std"] }
# The tick a proposal takes effect on and the slider scrubs to.
corvid_time = { version = "0.1", path = "../corvid_time", features = ["std"] }
# `I16F16`, which is what a tunable's range and a tunable's value are. A live
# tunable feeds `Rules`, which is hashed, so its arithmetic is the workspace's
# rather than a float.
corvid_transform = { version = "0.1", path = "../corvid_transform", default-features = false }
# The time slider is `Session::seek` with a range on it. There is no second
# implementation here: a slider that re-simulated its own way to a tick would
# be a second replay to keep in step with the first.
corvid_replay = { version = "0.1", path = "../corvid_replay", features = ["std"] }
# The `AudioFrame` the audio dump summarises and digests.
corvid_sound = { version = "0.1", path = "../corvid_sound", default-features = false }

[features]
default = []
# The seam the console's own widget tree attaches at, drawn through
# `corvid_ui`. Off by default, and it adds nothing on its own: everything in
# this crate — the registry, the tunables, the argument parsing, the overlay
# and the inspector — is a description a surface renders rather than a surface,
# and the crate is built and tested with nothing turned on.
ui = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
