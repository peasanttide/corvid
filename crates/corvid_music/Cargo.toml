[package]
name = "corvid_music"
description = "A soundtrack: Standard MIDI Files played through a SoundFont on rameau's synthesizer, to a sound card or into a buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# Not the workspace's licence. This crate links rameau, which is
# AGPL-3.0-or-later, and GPL-2.0-or-later code may be combined with it only
# under version 3 terms (section 13 of the GPLv3 and of the AGPLv3). So this
# crate, and any binary that turns it on, is distributed under the AGPL. That is
# why it sits behind a facade feature rather than in every build.
license = "AGPL-3.0-or-later"
keywords = ["gamedev", "audio", "midi", "soundfont", "music"]
categories = ["game-development", "multimedia::audio"]

[dependencies]
# The synthesizer and its parts, named here rather than in the workspace table
# because this is the one member that names them. Only the pure parts of
# rameau: its own device backends (kira, tinyaudio) are not used, because the
# device half here is the `cpal` that `corvid_audio` already links, so a game
# with sound effects and music links one audio library rather than two.
rameau_clip = "0.2.1"
rameau_midi = "0.2.1"
rameau_playback = "0.2.1"
rameau_software = "0.2.1"
rameau_soundfont = "0.2.1"
rameau_synthesizer = "0.2.1"
# The Unison bank, CC0-1.0, about 6.6 MiB of compressed samples. Optional,
# because a game that ships its own SoundFont should not carry a second one.
rameau_unison = { version = "0.2.1", optional = true }
thiserror = { workspace = true, features = ["std"] }
# The device, at the version `corvid_audio` opens one with, and what an opened
# stream and a bank that would not decode are reported through.
cpal = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"], optional = true }

[features]
default = []
# The embedded general-MIDI bank, and `Bank::unison`.
unison = ["dep:rameau_unison"]
# The sound card. Everything else -- parsing a song, decoding a bank, and the
# synthesizer filling a buffer -- builds and is tested without it.
device = ["dep:cpal", "dep:tracing"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
