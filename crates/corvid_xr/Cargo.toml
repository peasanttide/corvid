[package]
name = "corvid_xr"
description = "Headsets, hands and both scales: the XR vocabulary a Corvid game holds, with a scripted headset behind it so it runs with no hardware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = true
license.workspace = true
keywords = ["vr", "openxr", "xr", "deterministic", "gamedev"]
categories = ["game-development", "hardware-support"]

[dependencies]
corvid_fixed = { workspace = true, features = ["std"] }
corvid_glm = { workspace = true }
corvid_rotation = { workspace = true, features = ["std"] }
corvid_vector = { workspace = true, features = ["std"] }
# The matrices and the uniform block. An XR frustum is asymmetric, so the
# projection here is this crate's own — but the `Mat4`, the `Eye` and the view
# matrix either side of it are the same maths a flat camera does, and a second
# copy was a second convention to get wrong.
corvid_camera = { workspace = true }
# The `tan` behind the four half-angles, and it is const.
corvid_float = { workspace = true }
# The pose. A head is a `FineTransform` with a `GlobalFinePoint` position,
# which is the tier whose 15 µm is finer than the shimmer a wearer sees.
corvid_transform = { workspace = true, features = ["serde", "std"] }
# A track is a file, so a recording made on a real headset is something a test
# can carry. This is the workspace's one encoding and there is no second one.
corvid_wire = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }

# The real runtime. Off by default, so the vocabulary above compiles and tests
# on a machine with no graphics stack at all.
openxr = { version = "0.21", default-features = false, features = ["loaded"], optional = true }
# The seam. `wgpu-hal` is what turns the handles OpenXR gives out into
# something `wgpu` will accept, and `ash` is the type vocabulary both sides
# speak in.
wgpu-hal = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
ash = { version = "0.38", default-features = false, optional = true }

[dev-dependencies]
# The digest a frozen track is compared by. Nothing in the source names it: a
# track's `Hash` is derived, and what the tests pin is what that comes to under
# this workspace's one hasher.
corvid_hash = { workspace = true }

[features]
default = []
# A real headset, through OpenXR, drawing into a Vulkan swapchain `wgpu` is
# handed. `openxr` is loaded at run time rather than linked, so a build of this
# feature needs no SDK, and a run of it on a machine with no runtime answers
# `Unavailable::NoRuntime`.
openxr = ["dep:openxr", "dep:wgpu-hal", "dep:wgpu", "dep:ash"]

# The workspace's lint table, spelled out rather than inherited, because this
# crate changes exactly one line of it and Cargo refuses a table that both
# inherits and overrides.
[lints.rust]
# `deny` rather than the workspace's `forbid`, in this crate alone.
#
# OpenXR hands out Vulkan handles and `wgpu-hal` takes them; there is no safe
# API on either side of that seam. `forbid` cannot be lifted by an `allow`
# anywhere in the crate, which is exactly what makes it the right default and
# the wrong one here. `src/runtime/vulkan.rs` is the whole seam, it carries a
# file-level allow with a reason, and `tests/unsafe.rs` fails if the word
# appears in any other file of this crate, or if any other crate in the
# workspace relaxes this line.
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
todo = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unreachable = "deny"
allow_attributes_without_reason = "deny"
large_enum_variant = "deny"
needless_pass_by_value = "deny"
inefficient_to_string = "deny"

[package.metadata.docs.rs]
all-features = true
