[package]
name = "corvid_float"
description = "Floating-point maths in const context: the f32 and f64 utilities the boundary to a device needs, every one of them const."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["const", "float", "no-std", "gamedev", "math"]
categories = ["game-development", "mathematics", "no-std::no-alloc"]

[dependencies]
# The reason every function here can be `const`. `f32::sqrt` and its neighbours
# are intrinsics, and an intrinsic cannot be called in a const context at any
# optimization level -- so a const square root has to be a software one. This
# crate is that, on stable, through a wrapper type rather than operator
# overloading: the `const_trait_impl` and `const_mut_refs` features it offers
# are nightly, and neither of them is turned on here.
#
# The `no_std` feature is not optional despite the name reading like one.
# `const_soft_float` spells its crate attribute
# `#![cfg_attr(feature = "no_std", no_std)]`, so with the feature off it pulls
# in `std` -- and a dependency that links `std` makes our own `#![no_std]` a
# comment rather than a constraint, which only shows up as a wall of `can't
# find crate for std` the first time somebody builds for a bare-metal target.
# The feature gates nothing but that attribute; the source touches `core` only.
# `default-features = false` is kept for the day upstream grows a default set.
const_soft_float = { version = "0.1.4", default-features = false, features = [
    "no_std",
] }

[features]
default = []
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate.
std = []

[lints]
workspace = true

# Inert here, unlike in the four crates that carry the same two lines: the one
# feature adds no API, so the rendered page is identical with it and without.
# Kept anyway, because the alternative is a crate that is the only one in the
# workspace without this stanza and a reader who has to work out whether that
# was a decision -- and because the day `std` does start gating something, the
# page should show it without anyone remembering to come back here.
[package.metadata.docs.rs]
all-features = true
