[package]
name = "corvid_particle"
description = "Smoke, embers and shrapnel, as instances a renderer can draw and nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["particles", "vfx", "deterministic", "no-std", "gamedev"]
categories = ["game-development", "no-std"]

[dependencies]
# The colour a particle is, and the one type in this crate that is not a float:
# `LinearRgba` is fixed point, so a ramp is `Eq` and `Hash` and a golden can
# freeze one. The floats appear where the colour becomes an `Instance`, which is
# the same boundary `to_f32_array` exists for.
corvid_color = { workspace = true }
# The `Factor32` a ramp is sampled at, which is what `LinearRgba::lerp` takes.
corvid_fixed = { workspace = true }
# Every scalar function this crate calls: `sin`, `cos`, `sqrt`, `floor`. Naming
# one crate for all of them is what makes a build for a target with no operating
# system compute the same numbers as a hosted one -- `f32::sqrt` is an intrinsic
# and unavailable in `core`, so the alternative was `libm` in some builds and the
# hardware in others, which is two answers for one seed.
corvid_float = { workspace = true }
# The workspace's `f32` vector. A particle is client ring and lives a few metres
# from where it was born, so it is `Vec3` throughout and never a `GlobalPoint`;
# the README's second section says which frame that is in.
corvid_glm = { workspace = true }
# `Pod` and `Zeroable` on `Instance`, unconditionally, for the reason
# `corvid_mesh` holds `Vertex` that way: an instance whose whole purpose is to
# become the bytes of an instance buffer and cannot is not useful. Not a
# feature, so that `default` can be empty as it is everywhere but the facade.
bytemuck = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "particle"
harness = false

[features]
default = []
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate.
std = [
    "bytemuck/extern_crate_std",
    "corvid_color/std",
    "corvid_fixed/std",
    "corvid_float/std",
    "corvid_glm/std",
    "thiserror/std",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
