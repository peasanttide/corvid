[package]
name = "corvid_vector"
description = "Deterministic fixed-point 3-vectors: world positions, near-field offsets and unit directions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["fixed-point", "deterministic", "vector", "no-std", "gamedev"]
categories = ["game-development", "mathematics", "no-std::no-alloc"]

[dependencies]
arbitrary = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
corvid_fixed = { workspace = true }
mint = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# `tests/wire.rs` digests a round trip rather than comparing structures, which
# is what makes a moved field show up as one changed number.
corvid_hash = { workspace = true, features = ["std"] }
# `tests/wire.rs` freezes this crate's encoding as hex, so a field width or
# an ordering that moved is a failed test rather than a silent format change.
corvid_wire = { workspace = true, features = ["std"] }
serde_json = "1"

[features]
default = []
mint = ["dep:mint"]
nalgebra = ["dep:nalgebra"]
serde = ["dep:serde", "corvid_fixed/serde"]
bytemuck = ["dep:bytemuck", "corvid_fixed/bytemuck"]
arbitrary = ["dep:arbitrary", "corvid_fixed/arbitrary"]
std = [
    "bytemuck?/extern_crate_std",
    "serde?/std",
    "nalgebra?/std",
    "corvid_fixed/std",
]

[lints]
workspace = true

# Every optional integration is off by default, so a plain build documents none
# of them. Turn them all on for docs.rs.
[package.metadata.docs.rs]
all-features = true
