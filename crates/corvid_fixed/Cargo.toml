[package]
name = "corvid_fixed"
description = "Deterministic fixed-point scalars: fixed-point numbers, normalized factors, and wrapping angles with integer-only trigonometry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["fixed-point", "deterministic", "trigonometry", "no-std", "gamedev"]
categories = ["game-development", "mathematics", "no-std::no-alloc"]

[dependencies]
arbitrary = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
# Spelled here rather than in `[workspace.dependencies]` because this is the one
# crate that names it, and the one that can: the traits are about a scalar, and
# a scalar is what this crate defines. A vector or a transform has no `Zero` and
# no `Bounded` to offer, so nothing downstream has a reason to want this.
num-traits = { version = "0.2.19", default-features = false, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
nalgebra = { workspace = true }
serde_json = "1"

[features]
default = []
std = ["bytemuck?/extern_crate_std", "num-traits?/std", "serde?/std"]

# Criterion supplies its own `main`, so the built-in harness is off. Both
# benchmarks read the same input table, which `benches/common` builds.
[[bench]]
name = "trig"
harness = false

[[bench]]
name = "scalar"
harness = false

[lints]
workspace = true

# Every optional integration is off by default, so a plain build documents none
# of them. Turn them all on for docs.rs, or the feature table below advertises
# `Pod`, `Serialize`, and the `num-traits` operator traits that the rendered
# page then does not show.
[package.metadata.docs.rs]
all-features = true
