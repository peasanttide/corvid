[package]
name = "corvid_fixed"
description = "Deterministic fixed-point scalars: fixed-point numbers, normalized factors, and wrapping angles with integer-only trigonometry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["fixed-point", "deterministic", "trigonometry", "no-std", "gamedev"]
categories = ["game-development", "mathematics", "no-std::no-alloc"]

[dependencies]
arbitrary = { workspace = true, optional = true }
# How wide a magnitude is, which is the first step of every kernel here: the
# reciprocal square root normalizes to one binade and the arctangent normalizes
# its divisor to sixteen bits, and both begin by counting the bits. A leaf with
# no dependencies of its own, which is what lets this crate — the base of the
# workspace's arithmetic — take it.
corvid_bits = { workspace = true }
bytemuck = { workspace = true, optional = true }
# The rounding the `from_f64` conversions do. It is const, which is what keeps
# `I16F16::from_f64(0.5)` usable in a `const` — the whole reason that crate
# wraps a soft float rather than calling the intrinsic.
corvid_float = { workspace = true }
num-traits = { version = "0.2.19", default-features = false, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# The workspace's one encoding, so that this crate's byte goldens are recorded
# in the format a capture is actually written in rather than in a stand-in.
# Every scalar here goes inside somebody's snapshot, and a width is the one
# change nothing else in this crate can see.
corvid_wire = { workspace = true }
# The digest the tests here check a scalar's encoding against. Nothing in the
# source names it: a scalar's `Hash` is `core`'s, and what the tests pin is what
# that emission comes to under this workspace's one hasher.
corvid_hash = { workspace = true }
nalgebra = { workspace = true }
serde_json = "1"

[features]
default = []
std = [
    "bytemuck?/extern_crate_std",
    "num-traits?/std",
    "serde?/std",
]

[lints]
workspace = true

# Every optional integration is off by default, so a plain build documents none
# of them. Turn them all on for docs.rs, or the feature table below advertises
# `Pod`, `Serialize`, and the `num-traits` operator traits that the rendered
# page then does not show.
[package.metadata.docs.rs]
all-features = true
