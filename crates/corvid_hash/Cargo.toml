[package]
name = "corvid_hash"
description = "The deterministic digest every Corvid simulation is hashed with."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
keywords = ["hash", "deterministic", "digest", "no-std", "gamedev"]
categories = ["game-development", "algorithms", "no-std"]

[features]
default = []
