[package]
name = "corvid_wire"
description = "The one encoding a Corvid snapshot is written down in: fixed-width, little-endian, and nothing about the value it did not carry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["serialization", "deterministic", "no-std", "wire-format", "gamedev"]
categories = ["encoding", "game-development", "no-std"]

[dependencies]
serde = { workspace = true, features = ["alloc"] }
# The encoder, in its `legacy` configuration: little-endian, and every integer
# at its declared width. This is the only place in the workspace that names a
# *compact* format crate, and that is the point of the crate — a second one
# somewhere else is a second wire format, which is what this exists to stop.
# Eight crates name `serde_json` as a dev-dependency and that is deliberate: a
# JSON table sees a field's name and this encoding cannot, so the two tables
# cover different halves and neither is a capture format. `tests/golden.rs`
# freezes the bytes this produces, so an upgrade that moved them fails here
# rather than in somebody's save file.
bincode = { version = "2", default-features = false, features = ["alloc", "serde"] }

[features]
default = []
# Adds no API. It exists so a downstream can forward `std` uniformly across the
# workspace without special-casing this crate. [`Error`] implements
# `core::error::Error` either way.
std = ["serde/std", "bincode/std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
