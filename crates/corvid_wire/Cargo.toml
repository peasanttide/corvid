[package]
name = "corvid_wire"
description = "The one encoding a Corvid snapshot is written down in: little-endian, variable-length integers, and nothing about the value it did not carry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["serialization", "deterministic", "no-std", "wire-format", "gamedev"]
categories = ["encoding", "game-development", "no-std"]

[dependencies]
# Spelled out rather than `workspace = true`, which is the convention everywhere
# else here, because the workspace entry carries `derive` and this library
# derives nothing -- every `Serialize` in this crate is on a test fixture. Taking
# the workspace entry would put `syn`, `quote` and `proc-macro2` in the build of
# every downstream that wants only `encode` and `decode`.
serde = { version = "1", default-features = false, features = ["alloc"] }
# The encoder. Named here and nowhere else in the workspace, because a second
# manifest naming a compact format is a second wire format. `src/codec.rs` pins
# the configuration; `tests/golden.rs` freezes the bytes it produces, so an
# upgrade that moved them fails here rather than in somebody's save file.
bincode = { version = "2", default-features = false, features = ["alloc", "serde"] }
# The digest half of `round_trip_is_faithful`. A round trip that came back
# unequal and a round trip that came back digesting differently are two distinct
# findings, and the check reports both -- so the digest is part of the answer
# rather than a second opinion about it. Acyclic: `corvid_hash` has no
# dependencies of its own.
corvid_hash = { workspace = true }
# `Display` and `core::error::Error` on `Unfaithful`, derived. No `std` feature:
# this crate is `no_std`, and the derive names `core::error::Error` without one.
thiserror = { workspace = true }

[dev-dependencies]
# The self-describing row of the README's blindness grid, which this crate does
# not compute. Spelled inline for the reason `corvid_fixed` and `corvid_macros`
# spell theirs that way: a test detail of one crate is not a version two crates
# must agree on. The digest row's `corvid_hash` is a real dependency now, above.
serde_json = "1"
# `derive` for the fixtures, which is what the library above does without.
serde = { workspace = true }

[features]
default = []
# Adds no API -- `Error` implements `core::error::Error` either way. It exists so
# a downstream can forward `std` uniformly across the workspace without
# special-casing this crate.
std = ["serde/std", "bincode/std", "corvid_hash/std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
