[package]
name = "corvid_signal"
description = "Latest-value cells between Corvid subsystems: never waits for a consumer, never grows, and drops what nobody read."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["state", "threads", "watch", "tracing", "gamedev"]
categories = ["concurrency", "game-development"]

[dependencies]
# Unconditional, and part of what this crate is rather than an integration a
# downstream may decline. A publication that opened no span would be a handoff
# with one end missing from the trace, and the whole reason to route state
# between threads through one type rather than a `Mutex` per subsystem is that
# one type can be instrumented once. `default-features = false` drops
# `tracing-attributes`, whose `#[instrument]` nothing here uses.
tracing = { workspace = true, features = ["std"] }

[features]
# There are none, and that is a decision rather than an omission. `std` is not
# optional here — a thread is the thing this crate exists to carry state
# between — and the `tracing` span is the contract, so neither of the two things
# a feature could switch off is a thing a downstream may switch off. The CI arm
# builds this crate bare, which is the only configuration it has.
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
