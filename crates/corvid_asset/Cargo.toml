[package]
name = "corvid_asset"
description = "The ordered stack of data packs a level is read out of, and the digest of the set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
keywords = ["gamedev", "modding", "no-std", "deterministic", "assets"]
categories = ["game-development", "no-std"]

[dependencies]
# The filesystem a pack's files come out of. There is one `Source` in this
# workspace and a pack is a manifest bolted to one, rather than a second
# filesystem abstraction with the same job and a different spelling.
corvid_files = { workspace = true }
# The digest the mounted set condenses to, which is the whole point of the
# crate. Acyclic: `corvid_hash` has no dependencies of its own.
corvid_hash = { workspace = true }
# `PackId`. A pack identifier crosses the wire inside a game's rules, so it is a
# bounded name stored inline rather than a `String` two peers would have to
# agree about the length of after the fact.
corvid_name = { workspace = true }
# `Display` and `core::error::Error` on `Unmountable`, derived. No `std`
# feature: this crate is `no_std` and the derive names `core::error::Error`.
thiserror = { workspace = true }
# The manifest's encoding and nothing else's. Optional, because a stack mounts,
# resolves and digests without one -- a game that builds its manifests in code
# never reads a `pack.toml` at all.
serde = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
# A self-describing format for the manifest round trip, because the claim worth
# pinning is that a manifest reads as a readable record with named fields and
# not as a tuple of positions.
serde_json = "1"

[features]
default = []
# The manifest's encoding. Forwards to `corvid_name` so that a `PackId` written
# into a pack file reads as its text rather than as thirty-two numbers.
serde = ["dep:serde", "corvid_name/serde"]
# Adds no API -- every error here implements `core::error::Error` either way. It
# exists so a downstream can forward `std` uniformly across the workspace
# without special-casing this crate.
std = ["corvid_hash/std", "corvid_name/std", "serde?/std"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
