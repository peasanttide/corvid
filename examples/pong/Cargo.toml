[package]
name = "pong"
description = "Two machines, one ball: the smallest Corvid game with real netcode under it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# An example is not a library anyone installs. This one is here to be read, to
# be played against another process, and to be the thing `tests/session.rs`
# measures a rollback with.
publish = false

[dependencies]
# The device. Pinned at the workspace level, which is what keeps one `wgpu` and
# one `raw-window-handle` in the graph now that it is named here rather than
# reached through `corvid_render`.
wgpu = { workspace = true }
# The one name a game depends on: the two contracts, the renderer, the audio
# frame, the input snapshot, the maths stack and the session.
corvid = { path = "../..", default-features = false }
# Spans and events. A demo is the one place the framework's own instrumentation
# is worth seeing — which adapter was chosen, which frames were dropped, what
# the netcode did — and none of it appears without a subscriber installed.
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }
# `Serialize` and `Deserialize` on this game's own data types, which
# `corvid_behavior::Data` demands of every one of them.
serde = { workspace = true, features = ["derive", "std"] }
# The vertices, becoming bytes. `unsafe_code = "forbid"` means a game cannot do
# that by hand, and this is the crate that does it safely.
bytemuck = { workspace = true, optional = true }
# The link and the peer, named directly rather than reached through
# `corvid`, because `src/rally.rs` drives a `Peer` and a `MockNet` *below*
# the runtime: that is what makes the demo and the tests one piece of code, and
# what lets a session over a bad link be a `for` loop with no clock in it.
corvid_net = { workspace = true, optional = true }
corvid_lockstep = { workspace = true, features = ["std"], optional = true }
corvid_replay = { workspace = true, features = ["std"], optional = true }
# The encoding a datagram is written in, which the harness needs because it
# builds and reads datagrams itself.
corvid_wire = { workspace = true, features = ["std"], optional = true }

[features]
# A window, a device, a sound card, and the netcode. All four, because the point
# of this example is a game two people play and every one of them is part of
# that.
default = ["window", "net"]
# This game's own pipeline: one shader, one buffer, no camera.
render = ["dep:bytemuck"]
window = ["render", "corvid/window"]
# The other machine. It is what `--demo`, `--together` and `--listen` need, and
# without it this crate is a single-seat pong that still builds and still plays.
net = [
    "render",
    "corvid/net",
    "dep:corvid_net",
    "dep:corvid_lockstep",
    "dep:corvid_replay",
    "dep:corvid_wire",
]

[dev-dependencies]
# A directory nothing else is using for the tests that write a capture, and the
# PNG reader the one test that looks at a picture reads one with.
corvid_test = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
