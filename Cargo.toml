[package]
name = "corvid"
description = "A deterministic multiplayer cross platform game framework."
publish.workspace = true
version.workspace = true
edition.workspace = true
# Inherited here as well as in `crates/*`, and for the same reason the pin below
# gives: this is the one crate a game actually names, so it is the one where a
# downstream on an older toolchain most needs a version error rather than a wall
# of missing-method errors from somewhere deeper.
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

# The facade is one dependency, because `corvid_app` is the crate that already
# re-exports the two contracts, the maths stack, the client-ring data types and
# the session. Naming each of them here as well would be a second list to keep
# in step with the first.
[dependencies]
corvid_app = { workspace = true }
# Named individually rather than reached through `corvid_app`, because this is
# the workspace's one facade and every other crate re-exports nothing. A chain
# of forwarding crates gave the same type four spellings and no way to tell
# which was meant; one list in one place is the trade.
corvid_asset = { workspace = true }
corvid_behavior = { workspace = true, features = ["std"] }
corvid_bits = { workspace = true }
corvid_camera = { workspace = true, features = ["std", "bytemuck"] }
corvid_color = { workspace = true, features = ["std"] }
corvid_dev = { workspace = true }
corvid_fixed = { workspace = true, features = ["std"] }
corvid_float = { workspace = true }
corvid_glm = { workspace = true, features = ["std"] }
corvid_hash = { workspace = true, features = ["std"] }
corvid_input = { workspace = true }
corvid_mesh = { workspace = true }
corvid_mesh_render = { workspace = true, optional = true }
corvid_control = { workspace = true }
corvid_render = { workspace = true, optional = true }
corvid_replay = { workspace = true, features = ["std"] }
corvid_rotation = { workspace = true, features = ["std"] }
corvid_shape = { workspace = true, features = ["std"] }
corvid_signal = { workspace = true }
corvid_sound = { workspace = true, features = ["std"] }
corvid_time = { workspace = true, features = ["std"] }
corvid_transform = { workspace = true, features = ["std"] }
corvid_ui = { workspace = true, features = ["std"] }
corvid_ui_render = { workspace = true, optional = true }
corvid_vector = { workspace = true, features = ["std"] }
corvid_window = { workspace = true, optional = true }
corvid_wire = { workspace = true, features = ["std"] }

[dev-dependencies]
# The doctest above derives `Serialize` and `Deserialize` on a game's own state,
# which `corvid_behavior::Data` demands of it. A game's manifest carries the
# same line, so this is what the example is showing rather than a detail of
# testing it.
serde = { workspace = true, features = ["derive", "std"] }

# Three, and they are `corvid_app`'s three. `gamepad` is not among them, because
# `corvid_app` folded pads, a keyboard and a sound card into `window`: the three
# were describing one machine.
[features]
default = []
# The scratch-discarding runtime. It changes what a build computes rather than
# what it exposes, which is why it is forwarded under its own name rather than
# folded into anything else.
dev = ["corvid_app/dev"]
# Playing against other machines. The loop grows a `Peer` and a transport, and
# `App::transport` is the whole of what a caller sees of it — a game implements
# nothing. Off by default, because a single-seat run should not compile one.
net = ["corvid_app/net"]
# The drawing crates, and the `render` module of this facade. A game owes
# `Present` either way; `Render`, a mesh's device half and the UI's are what
# this adds.
#
# **It does not keep `wgpu` out of the build, and nothing does.** `corvid_app`
# names `corvid_render` unconditionally — `Render` is in the `App`'s own
# bounds — so `cargo tree -p corvid --no-default-features -i wgpu` finds it
# through `corvid_app`, whatever this feature says. This comment claimed the
# opposite, and cited `crates/corvid_app/tests/graphicless.rs` as the proof;
# that test asserts the reverse in as many words, under the name
# `every_build_of_the_runtime_compiles_wgpu`, and has since the runtime grew a
# renderer in its bounds.
#
# What a build without this still does not pay for is the **device**:
# `Render::REAL` is false for `()`, so no adapter is requested and no surface
# is acquired. That is a claim about a run rather than about a graph, and
# `crates/corvid_app/tests/windowless.rs` is where it is made.
render = [
    "corvid_app/render",
    "dep:corvid_render",
    "dep:corvid_mesh_render",
    "dep:corvid_ui_render",
]
# A window, a keyboard, a pad and a sound card: everything that is only ever
# true of a run with a player in front of it. One name rather than three,
# because the three were describing the same machine — and it implies `render`,
# because a window is a surface and a surface is a device.
window = ["render", "corvid_app/window", "dep:corvid_window", "corvid_input/platform"]

# As every crate in `crates/*` carries.
[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain this workspace is developed and tested against, rather than the
# oldest one the code happens to compile on. A bit-exactness workspace pins its
# compiler for the same reason it pins its arithmetic: the lints, the const
# evaluator, and the overflow behaviour that CI checks are the ones this version
# implements, and a downstream on an older toolchain should get a version error
# rather than a subtly different build. The floor the source alone would need is
# 1.87, set by `u32::is_multiple_of` in `corvid_fixed`'s `rsqrt`.
rust-version = "1.97.1"
repository = "https://github.com/peasanttide/corvid"
publish = true
license = "GPL-2.0-or-later"

[workspace.dependencies]
# Bit manipulation, and the floor of the whole stack: no dependencies at all,
# which is what lets `corvid_fixed` — the crate everything else here is built
# on — depend on it. How wide a magnitude is, and bringing a wide intermediate
# back to the width a component is.
corvid_bits = { version = "0.1", path = "crates/corvid_bits", default-features = false }
# Floating point, in const. The other half of the arithmetic floor, and the
# side of it nothing hashed ever touches: a matrix entry, a texture coordinate
# and a gain are all computed here and none of them is compared against another
# machine's answer.
corvid_float = { version = "0.1", path = "crates/corvid_float", default-features = false }
# The `f32` vectors and matrices, which are nalgebra's. The one crate that
# names nalgebra for its float types, for the reason `corvid_render` is the one
# that names `wgpu`: two linear algebra libraries in a graph are two `Matrix4`
# types that do not convert.
corvid_glm = { version = "0.1", path = "crates/corvid_glm", default-features = false }
corvid_fixed = { version = "0.1", path = "crates/corvid_fixed", default-features = false }
corvid_rotation = { version = "0.1", path = "crates/corvid_rotation", default-features = false }
corvid_transform = { version = "0.1", path = "crates/corvid_transform", default-features = false }
corvid_vector = { version = "0.1", path = "crates/corvid_vector", default-features = false }
corvid_behavior = { version = "0.1", path = "crates/corvid_behavior", default-features = false }
corvid_hash = { version = "0.1", path = "crates/corvid_hash", default-features = false }
corvid_time = { version = "0.1", path = "crates/corvid_time", default-features = false }
corvid_sound = { version = "0.1", path = "crates/corvid_sound", default-features = false }
corvid_input = { version = "0.1", path = "crates/corvid_input", default-features = false }
# The one text format in the workspace, and it is a *file a player edits*
# rather than an encoding anything is agreed over: a binding file. `corvid_wire`
# stays the encoding for everything a peer or a save reads, because a varint is
# not something to hand somebody a text editor for. Already in this tree as a
# test dependency of `corvid_input`, so this adds no crate to the build.
serde_json = { version = "1", default-features = false, features = ["std"] }
corvid_wire = { version = "0.1", path = "crates/corvid_wire", default-features = false }
# The client-local half that is not about a device: input, the view's motion and
# audio. No `default-features = false`, unlike every `no_std` crate here — this
# one used to be one and is not any more. It sits on top of `corvid_render`, so
# there is no build of it without a device under it, and a flag suppressing
# defaults it does not have would say the opposite.
corvid_control = { version = "0.1", path = "crates/corvid_control" }
corvid_replay = { version = "0.1", path = "crates/corvid_replay", default-features = false }
corvid_app = { version = "0.1", path = "crates/corvid_app" }
corvid_test = { version = "0.1", path = "crates/corvid_test" }
# The GPU. Pinned at the workspace level for the reason `mint` is: `wgpu` and
# anything that hands it a window handle have to agree on which
# `raw-window-handle` they mean, and two versions of that in one graph is a
# surface that cannot be created from a window that plainly exists.
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "webgpu"] }
# The half of `wgpu` that takes a handle somebody else made. Pinned here for a
# sharper reason than any other entry: `corvid_xr` calls `Device::as_hal` and
# `create_texture_from_hal`, whose type parameter is the `wgpu_hal::api::Vulkan`
# that *`wgpu` itself* was built against. A `wgpu-hal` resolved independently of
# `wgpu` is a different crate with the same name, and the error says
# "expected `wgpu_hal::api::Vulkan`, found `wgpu_hal::api::Vulkan`".
wgpu-hal = { version = "30", default-features = false, features = ["vulkan"] }
# The window. Pinned here for the same reason, and it is the other half of that
# agreement.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Blocking on a future exactly twice, at start-up, on the thread that owns the
# window. Nothing in this workspace has an async runtime and nothing here wants
# one.
pollster = "0.4"
# The capture seam's file format. Pinned here for the reason every other shared
# crate is: three manifests name it — `corvid_render` encodes a read-back frame,
# `corvid_test` and `corvid_mesh_render` decode one — and a golden compared
# across two versions of an encoder is a golden that says nothing.
png = "0.18"
corvid_window = { version = "0.1", path = "crates/corvid_window" }
# The device. The base of a game's client-local half. It no longer re-exports
# `wgpu` for the crates above it — they name it themselves and take the pin
# above — so what this owns is the renderer, the target and the read-back seam.
corvid_render = { version = "0.1", path = "crates/corvid_render" }
# The sound card. Its own `device` feature is what pulls `cpal`, so a crate
# naming this one still builds on a target with no audio backend.
corvid_audio = { version = "0.1", path = "crates/corvid_audio", default-features = false }
thiserror = "2"
# `rc` is what gives `Arc<T>` a `Serialize` and a `Deserialize`, and without it
# `corvid_behavior::Frame` — four `Arc` handles and two numbers — could not be
# written down at all. It is not a default feature and never has been, so no
# crate here loses it to a `default-features = false`, and it changes nothing
# about how any existing byte is written: before it, an `Arc` simply has no
# implementation to disagree with. What it does not do is preserve sharing, so a
# value behind two handles comes back behind two allocations.
serde = { version = "1", default-features = false, features = ["derive", "rc"] }
bytemuck = { version = "1", features = ["derive"] }
arbitrary = { version = "1", features = ["derive"] }
# Pinned here rather than per crate: the cross-crate `From` impls only line up
# while every crate resolves the same `mint::Vector3` and `nalgebra::Vector3`.
mint = "0.5"
nalgebra = { version = "0.34", default-features = false }
corvid_signal = { version = "0.1", path = "crates/corvid_signal" }
# Colour. Client ring, `no_std`, and depended on by nothing that draws — a
# `LinearRgba` is four floats a game writes into its own uniform buffer, and
# that crate has no opinion about which buffer that is.
corvid_color = { version = "0.1", path = "crates/corvid_color", default-features = false }
# Geometric primitives and the raycasts a cursor is resolved with. Client ring,
# `no_std`, integer-only — the same arithmetic the simulation uses, which is
# what lets a picking test run with no GPU in the process.
corvid_shape = { version = "0.1", path = "crates/corvid_shape", default-features = false }
# The ready-made cameras a `View` is composed out of. Client ring, `no_std`,
# and holding fixed point rather than a matrix: the 4x4 `f32` a device binds is
# `corvid_render::matrix`'s, which is the boundary and is the only place that
# names both.
corvid_camera = { version = "0.1", path = "crates/corvid_camera", default-features = false }
# The widget tree. Client ring, `no_std`, and behind no device: a `Painted` is
# rectangles and glyphs a renderer turns into pixels, and the crate has no
# opinion about which renderer.
corvid_ui = { version = "0.1", path = "crates/corvid_ui", default-features = false }
# What draws one. Reaches the device through `corvid_render`, which is the one
# crate in this workspace that names `wgpu`.
corvid_ui_render = { version = "0.1", path = "crates/corvid_ui_render" }
# The console, the tunables and the inspector. Its registry is typed, so help
# and completion are generated rather than written.
corvid_dev = { version = "0.1", path = "crates/corvid_dev" }
# Loading, caching and evicting what a level is made of. `std`, because it opens
# files, and its `Handle` cannot satisfy `Data` so it cannot reach a hashed
# state.
corvid_asset = { version = "0.1", path = "crates/corvid_asset" }
# The filesystem a level is read through. No dependencies and `no_std`, because
# `corvid_behavior` names `Source` in `Level::load`'s signature and everything
# in the ring is `no_std` — so the trait lives below `std` even though every
# real implementation of it is above.
corvid_files = { version = "0.1", path = "crates/corvid_files" }
# The wire, as a trait with a deterministic stand-in behind it. `MockNet` is the
# one implementation here, so two peers play in one process and the netcode lab
# and the netcode tests are the same setup with different assertions.
corvid_net = { version = "0.1", path = "crates/corvid_net" }
# Predict, roll back, and find the tick a desync started on. `no_std`, and it
# names no transport: it produces frames of bytes and a runtime carries them.
corvid_lockstep = { version = "0.1", path = "crates/corvid_lockstep", default-features = false }
# The headset. The workspace's one crate that relaxes `unsafe_code`, and the
# only one that may: OpenXR hands out Vulkan handles and `wgpu-hal` takes them.
# Its scripted stand-in is unconditional, so XR paths run with no hardware.
corvid_xr = { version = "0.1", path = "crates/corvid_xr", default-features = false }
# Geometry. Client ring, `no_std`, and naming no graphics library at all — which
# is the whole reason it is a crate rather than a module of `corvid_render`:
# `examples/alacarte/mesh` names this one and nothing else and builds for a
# target with no operating system.
corvid_mesh = { version = "0.1", path = "crates/corvid_mesh" }
# The device half of a mesh: the vertex layout, the upload and the draw call.
# It names `wgpu` itself, as every crate here that touches a device does; the
# pin above is what keeps one of it in the graph.
corvid_mesh_render = { version = "0.1", path = "crates/corvid_mesh_render" }
# Spans and events. Pinned here rather than per crate for the reason `mint` and
# `nalgebra` are: two versions of `tracing` in one graph are two independent
# subscriber registries, so half of a trace goes to each and the half that
# matters is whichever one nobody installed a subscriber on. `corvid_signal` is
# the only crate that needs it today; the runtime will.
tracing = { version = "0.1", default-features = false }
# The subscriber a *binary* installs. Pinned here beside `tracing` for the same
# reason and one more: a library that emits events and a binary that shows them
# have to agree on which registry they mean, and a second `tracing` in the graph
# is a second registry that nobody installed a subscriber on. No crate in
# `crates/*` names this — installing one is a binary's decision, and a library
# that made it would be a library nobody can silence.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
todo = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unreachable = "deny"
allow_attributes_without_reason = "deny"
large_enum_variant = "deny"
needless_pass_by_value = "deny"
inefficient_to_string = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
