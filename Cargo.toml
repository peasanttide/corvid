[package]
name = "corvid"
description = "A deterministic multiplayer cross platform game framework."
publish.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain this workspace is developed and tested against, rather than the
# oldest one the code happens to compile on. A bit-exactness workspace pins its
# compiler for the same reason it pins its arithmetic: the lints, the const
# evaluator and the overflow behaviour that CI checks are the ones this version
# implements, and a downstream on an older toolchain should get a version error
# rather than a subtly different build.
#
# The floor the source alone would need is 1.88, set by let-chains in
# `corvid_signal`'s `tests/tracing.rs`, with `u32::is_multiple_of` (1.87) in
# `corvid_fixed`'s `rsqrt` and edition 2024 (1.85) below that.
#
# The `msrv` job is what makes this a promise rather than a note: every other
# job runs on whatever stable the runner has, so nothing else here would notice
# the day a crate reaches past it.
rust-version = "1.97.1"
repository = "https://github.com/peasanttide/corvid"
publish = true
license = "GPL-2.0-or-later"

[workspace.dependencies]
# The workspace's own crates, so that a member names a sibling as
# `corvid_fixed = { workspace = true }` and the version and the path are
# written here once. The facade is absent on purpose: it is the crate that
# re-exports these, so nothing in the workspace depends on it.
corvid_bits = { version = "0.1.0", path = "crates/corvid_bits" }
corvid_behavior = { version = "0.1.0", path = "crates/corvid_behavior" }
corvid_camera = { version = "0.1.0", path = "crates/corvid_camera" }
corvid_files = { version = "0.1.0", path = "crates/corvid_files" }
corvid_fixed = { version = "0.1.0", path = "crates/corvid_fixed" }
corvid_float = { version = "0.1.0", path = "crates/corvid_float" }
corvid_glm = { version = "0.1.0", path = "crates/corvid_glm" }
corvid_hash = { version = "0.1.0", path = "crates/corvid_hash" }
corvid_input = { version = "0.1.0", path = "crates/corvid_input" }
corvid_macros = { version = "0.1.0", path = "crates/corvid_macros" }
corvid_name = { version = "0.1.0", path = "crates/corvid_name" }
corvid_net = { version = "0.1.0", path = "crates/corvid_net" }
corvid_net_mock = { version = "0.1.0", path = "crates/corvid_net_mock" }
corvid_net_udp = { version = "0.1.0", path = "crates/corvid_net_udp" }
corvid_shape = { version = "0.1.0", path = "crates/corvid_shape" }
corvid_rotation = { version = "0.1.0", path = "crates/corvid_rotation" }
corvid_signal = { version = "0.1.0", path = "crates/corvid_signal" }
corvid_time = { version = "0.1.0", path = "crates/corvid_time" }
corvid_transform = { version = "0.1.0", path = "crates/corvid_transform" }
corvid_vector = { version = "0.1.0", path = "crates/corvid_vector" }
corvid_color = { version = "0.1.0", path = "crates/corvid_color" }
corvid_wire = { version = "0.1.0", path = "crates/corvid_wire" }

# `default-features = false` for the reason `serde` below has it: a crate here
# starts `#![no_std]`, and the default feature is what pulls in the `std`
# `Error` rather than `core`'s. A member that wants the `std` half turns it on
# for itself.
thiserror = { version = "2", default-features = false }

# The benchmark harness. A dev-dependency of three members, so the version is
# written here once: a benchmark that reported against a different Criterion
# than the row beside it would not be a comparison. `default-features = false`
# drops the plotting and the rayon it pulls in; the numbers are read from the
# terminal.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
serde = { version = "1", default-features = false, features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
arbitrary = { version = "1", features = ["derive"] }
# Pinned here rather than per crate: the cross-crate `From` impls only line up
# while every crate resolves the same `mint::Vector3` and `nalgebra::Vector3`.
mint = "0.5"
nalgebra = { version = "0.34", default-features = false }
# Spans and events. Pinned here rather than per crate for the reason `mint` and
# `nalgebra` are: two versions of `tracing` in one graph are two independent
# subscriber registries, so half of a trace goes to each and the half that
# matters is whichever one nobody installed a subscriber on. `corvid_signal` is
# the only crate that needs it today; the runtime will.
tracing = { version = "0.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unreachable = "deny"
allow_attributes_without_reason = "deny"
large_enum_variant = "deny"
needless_pass_by_value = "deny"
inefficient_to_string = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
