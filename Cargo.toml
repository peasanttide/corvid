[package]
name = "corvid"
description = "A deterministic multiplayer cross platform game framework."
publish.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Set by `u32::is_multiple_of` (1.87) in `corvid_fixed`'s `rsqrt`; `u64::isqrt`
# in a `const` context (1.84) and edition 2024 (1.85) are the next two floors
# down. Declared so a downstream on an older toolchain gets a version error
# rather than a wall of missing-method errors.
rust-version = "1.87"
repository = "https://github.com/peasanttide/corvid"
publish = true
license = "GPL-2.0-or-later"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", default-features = false, features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
arbitrary = { version = "1", features = ["derive"] }
# Pinned here rather than per crate: the cross-crate `From` impls only line up
# while every crate resolves the same `mint::Vector3` and `nalgebra::Vector3`.
mint = "0.5"
nalgebra = { version = "0.34", default-features = false }
# Spans and events. Pinned here rather than per crate for the reason `mint` and
# `nalgebra` are: two versions of `tracing` in one graph are two independent
# subscriber registries, so half of a trace goes to each and the half that
# matters is whichever one nobody installed a subscriber on. `corvid_signal` is
# the only crate that needs it today; the runtime will.
tracing = { version = "0.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
todo = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unreachable = "deny"
allow_attributes_without_reason = "deny"
large_enum_variant = "deny"
needless_pass_by_value = "deny"
inefficient_to_string = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
