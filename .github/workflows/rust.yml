name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # `sccache` in front of rustc, with GitHub's own action cache behind it. Five
  # jobs compile overlapping halves of the same thirty-six packages — `check`
  # and `msrv` share everything, and `cross` and `determinism` share the
  # simulation ring with both — so the object a second job needs has usually
  # already been built by a first.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Does it build, does it pass, and does it say what it means. One job, because
  # these all want the same checkout and the same warm target directory.
  check:
    runs-on: ubuntu-latest
    # The backstop of last resort. Every test here that waits on another thread
    # carries a deadline of its own, and this is what catches the wait that
    # nobody wrapped: a wedged test binary keeps a runner for six hours and
    # reports nothing, which has happened.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: Swatinem/rust-cache@v2
      with:
        # `sccache` holds the object files now. This one stays for the registry
        # index and the git checkouts, which it caches and `sccache` does not —
        # caching the target directory as well would be two copies of the same
        # build, restored twice.
        cache-targets: false
    # The two system libraries this workspace's device halves are built against.
    # `corvid_audio/device` reaches `cpal` and then `alsa-sys`, and
    # `corvid_window/gamepad` reaches `gilrs` and then `libudev-sys`; both probe
    # with `pkg-config` in a build script and panic when the `.pc` file is
    # absent, so a runner without them fails before rustc is asked anything.
    # Every step below that passes `--all-features` compiles both.
    #
    # Nothing else here needs a system library: `wgpu`'s Vulkan backend loads
    # the loader at runtime through `ash`, and `winit` is pinned with `x11` and
    # `wayland-dlopen`, which do the same.
    - name: System libraries the device halves link against
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

    - name: Formatting
      run: cargo fmt --all --check
    # A warning that nobody fails on is a warning that accumulates. The
    # workspace pins its own rules in `[workspace.lints]` — `unsafe_code`
    # forbidden, `panic`/`unwrap_used`/`missing_docs` denied — and this is what
    # makes them rules rather than a convention. `-D warnings` goes here rather
    # than in `RUSTFLAGS`, which would hold every crates.io dependency to rules
    # this workspace wrote for itself.
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Docs
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --all-features

    # Only `--all-features`. Every optional integration is off by default, so a
    # plain `cargo test` compiles the wire format and the layout assertions out
    # entirely, which makes the all-features run a superset of it.
    - name: Tests, all features
      run: cargo test --workspace --all-features
    # Overflow checks are on in dev and off in release, so the two profiles
    # disagree about what a wrapped intermediate does — the one divergence a
    # bit-exactness workspace cannot ship.
    - name: Tests, all features, release
      run: cargo test --workspace --all-features --release

    # A target with no operating system is the check with teeth: a crate that
    # quietly reached for `std` fails here rather than being discovered by
    # whoever first builds a dedicated server or a console port.
    #
    # Not the whole simulation ring, and the ceiling is not this workspace's:
    # `corvid_float` depends on `const_soft_float`, which does not declare
    # `#![no_std]`, so nothing above `corvid_float` has a bare-metal build to
    # check. `corvid_fixed` is *not* above it — it names `corvid_bits` and
    # nothing else — so the fixed-point arithmetic and `corvid_time` on top of it
    # are both here. The wider portability claim is the `cross` job, where it is
    # checked on targets that do have an operating system.
    - name: Build for a target with no operating system
      run: |
        set -eu
        rustup target add thumbv7em-none-eabi
        for crate in corvid_bits corvid_hash corvid_wire corvid_files \
                     corvid_macros corvid_fixed corvid_time; do
          echo "== $crate"
          cargo build -p "$crate" --no-default-features --target thumbv7em-none-eabi
        done

  # `rust-version` is a promise to a downstream, and every other job here runs
  # on whatever stable the runner has — so a crate reaching past the declared
  # floor compiles green here and breaks the first person who believed the
  # manifest. This is the only arm that would notice.
  #
  # `--all-targets`, because a test target is where it slips in: nothing a
  # downstream compiles, and nothing any other arm holds to the floor.
  #
  # The version is read out of the manifest rather than written here twice,
  # since two copies of a number are one copy and one stale copy.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
    # `--all-targets` reaches the device halves, which probe with `pkg-config`.
    - name: System libraries the device halves link against
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
    - name: The oldest toolchain the manifest promises
      run: |
        set -eu
        floor=$(cargo metadata --format-version 1 --no-deps \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')
        echo "rust-version is $floor"
        rustup toolchain install "$floor" --profile minimal
        cargo "+$floor" check --workspace --all-targets --all-features

  # The claim the whole design rests on is that a simulation computes the same
  # bits on every machine. This job is the half that says the code *compiles*
  # elsewhere — that no crate below the runtime has quietly grown a dependency
  # on a pointer width, an operating system or a float. What it says nothing
  # about is what those builds compute; that is `determinism` below.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target:
          # A second 64-bit architecture, with a different code generator and a
          # different floating-point story.
          - aarch64-unknown-linux-gnu

    steps:
    - uses: actions/checkout@v4
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: Swatinem/rust-cache@v2
      with:
        # `sccache` holds the object files now. This one stays for the registry
        # index and the git checkouts, which it caches and `sccache` does not —
        # caching the target directory as well would be two copies of the same
        # build, restored twice.
        cache-targets: false
    - run: rustup target add ${{ matrix.target }}
    # The simulation ring and the client ring's data types: everything two peers
    # have to agree about, plus everything a capture is made of. The runtime is
    # not here — `corvid_app` is unconditionally `std`, and the crates that own
    # a device are `std` with it.
    #
    # `cargo build` of a library produces an rlib and links nothing, so no
    # cross-linker is needed for any of these.
    - name: Build the portable crates
      run: |
        set -eu
        for crate in corvid_bits corvid_float corvid_fixed corvid_vector \
                     corvid_rotation corvid_transform corvid_hash corvid_time \
                     corvid_wire corvid_files corvid_behavior corvid_replay \
                     corvid_lockstep corvid_shape corvid_camera corvid_color \
                     corvid_sound corvid_input corvid_mesh corvid_ui; do
          echo "== $crate for ${{ matrix.target }}"
          cargo build -p "$crate" --no-default-features --target ${{ matrix.target }}
        done

  # `corvid_hash` overrides `write_usize` and `write_isize` so a `Vec`'s length
  # prefix is eight bytes on every target rather than the pointer width, which
  # is the one thing standing between a `wasm32` browser peer and a native
  # server agreeing on a digest. Every other arm runs on a 64-bit host, where
  # the override and the native-width default write the identical eight
  # little-endian bytes — so deleting the override outright leaves all of them
  # green, `tests/width.rs` included. The regression this crate exists to
  # prevent is invisible to a workflow that never leaves a 64-bit `usize`.
  #
  # `i686-unknown-linux-gnu` is the cheapest target that actually *runs* the
  # tests with a four-byte `usize`: it needs a multilib gcc and no emulator,
  # where `wasm32` would need a runtime and would only ever be a build. Measured
  # rather than assumed — replacing both overrides with the native-width write
  # `core` defaults to leaves the whole suite green on `x86_64` and fails
  # exactly one test here.
  narrow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
    - name: A four-byte usize, and the digest that must not move with it
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
        rustup target add i686-unknown-linux-gnu
        cargo test -p corvid_hash --all-features --target i686-unknown-linux-gnu

  # The other half, and the one about output rather than about compiling:
  # `examples/pong`'s `tests/baseline.rs` holds the simulation to two digests
  # recorded before the contracts were rewritten. It would notice the arithmetic
  # moving, a field's width altering, or the loop's order changing — none of
  # which any test comparing one run against another can see.
  #
  # Run on aarch64, which is what makes "the same digest everywhere" a checked
  # property rather than an argument from the source being integer-only: the
  # numbers in `baseline.rs` were recorded on x86-64, and `check` above already
  # replays them there. This arm is the one that would notice an architecture
  # disagreeing, and a red arm named `determinism` says so without anybody
  # reading a log.
  determinism:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: Swatinem/rust-cache@v2
      with:
        # `sccache` holds the object files now. This one stays for the registry
        # index and the git checkouts, which it caches and `sccache` does not —
        # caching the target directory as well would be two copies of the same
        # build, restored twice.
        cache-targets: false
    # As in `check`. None of the three suites below opens a sound card or reads
    # a pad, but `examples/pong` ships with `window` on by default and that
    # reaches `corvid_audio/device` and `corvid_window/gamepad` — so both are
    # *compiled* here even though neither is called, and a build script that
    # cannot find its `.pc` file fails whether or not the code runs.
    - name: System libraries the device halves link against
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
    # Three suites, and none of them asks for an adapter — the baseline is a
    # headless simulation, which is what lets it run on a machine with no GPU.
    # Both profiles, because overflow checks are on in dev and off in release,
    # and a digest that moved with the profile is exactly the failure this
    # exists to catch.
    - name: The frozen digests, debug
      run: cargo test -p pong --test baseline --test table --test bot
    - name: The frozen digests, release
      run: cargo test -p pong --test baseline --test table --test bot --release
