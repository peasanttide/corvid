name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --workspace --verbose
    # Every optional integration is off by default, so a plain `cargo test`
    # compiles out the serde, bytemuck, mint and nalgebra tests entirely — the
    # wire format and the layout assertions among them.
    - name: Run tests, default features
      run: cargo test --workspace --verbose
    - name: Run tests, all features
      run: cargo test --workspace --all-features --verbose
    # Neither of the two runs above compiles a feature *on its own*. A feature
    # that forgets to forward one of its dependency's own features builds fine
    # under `--all-features`, where something else turns it on, and fails for
    # the one user who enables only it.
    - name: Build each feature on its own
      run: |
        set -eu
        for crate in corvid_vector corvid_rotation corvid_transform; do
          for feature in mint nalgebra serde bytemuck arbitrary std; do
            echo "== $crate --features $feature"
            cargo build -p "$crate" --no-default-features --features "$feature"
          done
        done
        for feature in bytemuck serde arbitrary num-traits std; do
          echo "== corvid_fixed --features $feature"
          cargo build -p corvid_fixed --no-default-features --features "$feature"
        done
        # `corvid_bits` has one feature and it currently forwards nothing, so
        # this arm passes trivially today. It is here for the day it stops
        # being trivial: a `std` that starts gating an API is a change nothing
        # else in this matrix would catch, because every other run either has
        # the feature off or has everything on.
        for feature in std; do
          echo "== corvid_bits --features $feature"
          cargo build -p corvid_bits --no-default-features --features "$feature"
        done
        # `corvid_float` has the one feature, and it is the odd one: it forwards
        # nothing and adds no API, existing only so a downstream can turn `std`
        # on everywhere without special-casing this crate. Built alone anyway,
        # because "this feature does nothing" is a claim like any other and the
        # day it starts gating something is the day nobody remembers it was.
        for feature in std; do
          echo "== corvid_float --features $feature"
          cargo build -p corvid_float --no-default-features --features "$feature"
        done
        for feature in bytemuck mint std; do
          echo "== corvid_glm --features $feature"
          cargo build -p corvid_glm --no-default-features --features "$feature"
        done
        # `corvid_hash`'s one feature switches nothing on — the crate never
        # reaches past `core`, and `std` is there so a downstream can forward it
        # uniformly across the workspace instead of special-casing one leaf. A
        # feature that does nothing is exactly the kind that rots without anyone
        # noticing, because no other arm of this workflow ever names it on its
        # own, so it is built here to keep the name honest.
        for feature in std; do
          echo "== corvid_hash --features $feature"
          cargo build -p corvid_hash --no-default-features --features "$feature"
        done
        # `corvid_wire`'s one feature is the first in this loop that actually
        # forwards: `std` reaches both `serde` and the encoder, and a version of
        # it that named only one of them would compile under `--all-features`,
        # where the other crate turns its own on, and fail for the first
        # downstream that asks for exactly this.
        for feature in std; do
          echo "== corvid_wire --features $feature"
          cargo build -p corvid_wire --no-default-features --features "$feature"
        done
        # `corvid_time`'s two both forward into `corvid_fixed`, and `std` is the
        # only feature in this loop that adds API rather than only plumbing —
        # `Clock::wall` does not exist without it. A `serde` that forgot
        # `corvid_fixed/serde` is the exact shape this job exists to catch: it
        # compiles under `--all-features`, where `std` turns the same thing on.
        for feature in serde std; do
          echo "== corvid_time --features $feature"
          cargo build -p corvid_time --no-default-features --features "$feature"
        done
    # A target with no operating system is the check with teeth. Five crates here
    # declare `#![no_std]`, and nothing so far has held them to it: every arm
    # above builds for the host, where a crate that quietly reached for `std`
    # compiles and passes, and the discovery is left to whoever first builds a
    # dedicated server or a console port. `corvid_wire` is the sharpest case,
    # being the first of them with a dependency of its own — `bincode` is
    # `no_std` only while `alloc` is on and `std` is off, which is a property of
    # this crate's manifest rather than of its source.
    #
    # Not the whole workspace, and the ceiling is not this workspace's:
    # `corvid_float` depends on `const_soft_float`, which does not declare
    # `#![no_std]`, so nothing above `corvid_float` has a bare-metal build to
    # check. `corvid_fixed` is *not* above it — it names `corvid_bits` and
    # nothing else — so the fixed-point arithmetic and `corvid_time` on top of
    # it are both here.
    - name: Build for a target with no operating system
      run: |
        set -eu
        rustup target add thumbv7em-none-eabi
        for crate in corvid_bits corvid_hash corvid_wire corvid_files \
                     corvid_macros corvid_fixed corvid_time; do
          echo "== $crate"
          cargo build -p "$crate" --no-default-features --target thumbv7em-none-eabi
        done
    # `corvid_hash` overrides `write_usize` and `write_isize` so a `Vec`'s
    # length prefix is eight bytes on every target rather than the pointer
    # width, which is the one thing standing between a `wasm32` browser peer and
    # a native server agreeing on a digest. Every arm above runs on the 64-bit
    # host, where the override and the native-width default write the identical
    # eight little-endian bytes — so deleting the override outright leaves all
    # of them green, `tests/width.rs` included. The regression this crate exists
    # to prevent is invisible to a workflow that never leaves `x86_64`.
    #
    # `i686-unknown-linux-gnu` is the cheapest target that actually *runs* the
    # tests with a four-byte `usize`: it needs a multilib gcc and no emulator,
    # where `wasm32` would need a runtime and would only ever be a build.
    #
    # Measured rather than assumed. Replacing both overrides with the
    # native-width write that `core` defaults to leaves all 68 tests green on
    # `x86_64` and fails exactly one here —
    # `width::a_pointer_sized_integer_is_absorbed_as_sixty_four_bits`. So this
    # arm is the only thing in the workflow standing between that regression and
    # a merge, and `tests/width.rs` is the only file in it that notices.
    # `tests/golden.rs` is not a second net: its rows drive the `Hasher` with
    # words and byte slices directly rather than through `Hash` on a container,
    # so they never reach `write_usize` and cannot move with the pointer width.
    # The whole suite is run anyway, because it costs one link over running the
    # one file and it covers whatever becomes width-dependent later.
    - name: Run tests on a 32-bit target
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
        rustup target add i686-unknown-linux-gnu
        cargo test -p corvid_hash --all-features --target i686-unknown-linux-gnu
    # Overflow checks are on in dev and off in release, so the two profiles
    # disagree about what a wrapped intermediate does — the one divergence a
    # bit-exactness crate cannot ship. Both arms have to run.
    - name: Run tests, release
      run: cargo test --workspace --all-features --release --verbose
    # The workspace pins its own rules in `[workspace.lints]` — `unsafe_code`
    # forbidden, `panic`/`unwrap_used`/`missing_docs` denied. They are only a
    # convention if something runs them.
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Formatting
      run: cargo fmt --all --check
    - name: Docs
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --all-features
