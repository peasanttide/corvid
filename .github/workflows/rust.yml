name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    # The backstop of last resort. This job has no caching, and a wedged step
    # keeps a runner for six hours and reports nothing.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --workspace --verbose
    # Only `--all-features`. Every optional integration is off by default, so a
    # plain `cargo test` compiles out the serde, bytemuck, mint and nalgebra
    # tests entirely — the wire format and the layout assertions among them —
    # which makes the all-features run a superset of it. The `Build` step above
    # is what still compiles the default set.
    - name: Run tests, all features
      run: cargo test --workspace --all-features --verbose
    # A target with no operating system is the check with teeth. Seven crates
    # here declare `#![no_std]`, and nothing so far has held them to it: every arm
    # above builds for the host, where a crate that quietly reached for `std`
    # compiles and passes, and the discovery is left to whoever first builds a
    # dedicated server or a console port. `corvid_wire` is the sharpest case,
    # being the first of them with a dependency of its own — `bincode` is
    # `no_std` only while `alloc` is on and `std` is off, which is a property of
    # this crate's manifest rather than of its source.
    #
    # Not the whole workspace, and the ceiling is not this workspace's:
    # `corvid_float` depends on `const_soft_float`, which does not declare
    # `#![no_std]`, so nothing above `corvid_float` has a bare-metal build to
    # check. `corvid_fixed` is *not* above it — it names `corvid_bits` and
    # nothing else — so the fixed-point arithmetic and `corvid_time` on top of
    # it are both here.
    - name: Build for a target with no operating system
      run: |
        set -eu
        rustup target add thumbv7em-none-eabi
        for crate in corvid_bits corvid_hash corvid_wire corvid_files \
                     corvid_macros corvid_fixed corvid_time; do
          echo "== $crate"
          cargo build -p "$crate" --no-default-features --target thumbv7em-none-eabi
        done

    # `corvid_hash` overrides `write_usize` and `write_isize` so a `Vec`'s
    # length prefix is eight bytes on every target rather than the pointer
    # width, which is the one thing standing between a `wasm32` browser peer and
    # a native server agreeing on a digest. Every arm above runs on the 64-bit
    # host, where the override and the native-width default write the identical
    # eight little-endian bytes — so deleting the override outright leaves all
    # of them green, `tests/width.rs` included. The regression this crate exists
    # to prevent is invisible to a workflow that never leaves `x86_64`.
    #
    # `i686-unknown-linux-gnu` is the cheapest target that actually *runs* the
    # tests with a four-byte `usize`: it needs a multilib gcc and no emulator,
    # where `wasm32` would need a runtime and would only ever be a build.
    #
    # Measured rather than assumed. Replacing both overrides with the
    # native-width write that `core` defaults to leaves all 68 tests green on
    # `x86_64` and fails exactly one here —
    # `width::a_pointer_sized_integer_is_absorbed_as_sixty_four_bits`. So this
    # arm is the only thing in the workflow standing between that regression and
    # a merge, and `tests/width.rs` is the only file in it that notices.
    # `tests/golden.rs` is not a second net: its rows drive the `Hasher` with
    # words and byte slices directly rather than through `Hash` on a container,
    # so they never reach `write_usize` and cannot move with the pointer width.
    # The whole suite is run anyway, because it costs one link over running the
    # one file and it covers whatever becomes width-dependent later.
    - name: Run tests on a 32-bit target
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
        rustup target add i686-unknown-linux-gnu
        cargo test -p corvid_hash --all-features --target i686-unknown-linux-gnu
    # Overflow checks are on in dev and off in release, so the two profiles
    # disagree about what a wrapped intermediate does — the one divergence a
    # bit-exactness crate cannot ship. Both arms have to run.
    - name: Run tests, release
      run: cargo test --workspace --all-features --release --verbose
    # The workspace pins its own rules in `[workspace.lints]` — `unsafe_code`
    # forbidden, `panic`/`unwrap_used`/`missing_docs` denied. They are only a
    # convention if something runs them.
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Formatting
      run: cargo fmt --all --check
    - name: Docs
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --all-features

  # `rust-version` is a promise to a downstream, and every other job here runs
  # on whatever stable the runner has — so a crate reaching past the declared
  # floor compiles green here and breaks the first person who believed the
  # manifest. This is the only arm that would notice.
  #
  # `--all-targets`, because a test target is where it slips in: nothing a
  # downstream compiles, and nothing any other arm holds to the floor.
  #
  # The version is read out of the manifest rather than written here twice,
  # since two copies of a number are one copy and one stale copy.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: The oldest toolchain the manifest promises
      run: |
        set -eu
        floor=$(cargo metadata --format-version 1 --no-deps \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')
        echo "rust-version is $floor"
        rustup toolchain install "$floor" --profile minimal
        cargo "+$floor" check --workspace --all-targets --all-features
